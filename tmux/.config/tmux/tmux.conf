# ==============================================================================
# TERMINAL
# ==============================================================================
set-option -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# ==============================================================================
# GENERAL
# ==============================================================================
set -g base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
set -g history-limit 50000
set -g mouse on

# ==============================================================================
# APPEARANCE
# ==============================================================================
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# ==============================================================================
# PREFIX
# ==============================================================================
unbind C-b
set -g prefix M-m
bind M-m send-prefix

# ==============================================================================
# KEY BINDINGS
# ==============================================================================
# Splits
unbind %
unbind '"'
bind | split-window -h
bind - split-window -v

# Config reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Pane resizing (repeatable)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

# Window switching (no prefix)
bind-key -n M-h select-window -t 1
bind-key -n M-j select-window -t 2
bind-key -n M-k select-window -t 3
bind-key -n M-l select-window -t 4
bind C-p previous-window
bind C-n next-window

# ==============================================================================
# COPY MODE (VI)
# ==============================================================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y     send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==============================================================================
# PLUGINS (TPM)
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.0'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '0'

# ==============================================================================
# THEME (catppuccin)
# ==============================================================================
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"
# set -g @catppuccin_status_background "none"

# --> Rosé Pine
set -ogq @thm_bg "#191724"
set -ogq @thm_fg "#e0def4"
# Colors
set -ogq @thm_rosewater "#ebbcba"
set -ogq @thm_flamingo "#ebbcba"
set -ogq @thm_pink "#eb6f92"
set -ogq @thm_mauve "#c4a7e7"
set -ogq @thm_red "#eb6f92"
set -ogq @thm_maroon "#eb6f92"
set -ogq @thm_peach "#f6c177"
set -ogq @thm_yellow "#f6c177"
set -ogq @thm_green "#31748f"
set -ogq @thm_teal "#9ccfd8"
set -ogq @thm_sky "#9ccfd8"
set -ogq @thm_sapphire "#9ccfd8"
set -ogq @thm_blue "#9ccfd8"
set -ogq @thm_lavender "#c4a7e7"
# Surfaces and overlays
set -ogq @thm_subtext_1 "#908caa"
set -ogq @thm_subtext_0 "#908caa"
set -ogq @thm_overlay_2 "#6e6a86"
set -ogq @thm_overlay_1 "#6e6a86"
set -ogq @thm_overlay_0 "#26233a"
set -ogq @thm_surface_2 "#524f67"
set -ogq @thm_surface_1 "#403d52"
set -ogq @thm_surface_0 "#1f1d2e"
# set -ogq @thm_mantle "#21202e"
set -ogq @thm_mantle "#191724"
set -ogq @thm_crust "#191724"


# run '~/.config/tmux/plugins/tmux/catppuccin.tmux'


# ==============================================================================
# STATUS BAR
# ==============================================================================
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# ==============================================================================
# TPM INIT — must be last
# ==============================================================================
run '~/.tmux/plugins/tpm/tpm'
