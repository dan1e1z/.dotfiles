# ==============================================================================
# TERMINAL
# ==============================================================================
set-option -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# ==============================================================================
# GENERAL
# ==============================================================================
set -g base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
set -g history-limit 50000
set -g mouse on

# ==============================================================================
# APPEARANCE
# ==============================================================================
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# ==============================================================================
# PREFIX
# ==============================================================================
unbind C-b
set -g prefix M-m
bind M-m send-prefix

# ==============================================================================
# KEY BINDINGS
# ==============================================================================
# Splits
unbind %
unbind '"'
bind | split-window -h
bind - split-window -v

# Config reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Pane resizing (repeatable)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

# Window switching (no prefix)
bind-key -n M-h select-window -t 1
bind-key -n M-j select-window -t 2
bind-key -n M-k select-window -t 3
bind-key -n M-l select-window -t 4
bind C-p previous-window
bind C-n next-window

# ==============================================================================
# COPY MODE (VI)
# ==============================================================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y     send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==============================================================================
# PLUGINS (TPM)
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '0'


# ==============================================================================
# THEME (catppuccin + Rosé Pine color overrides)
# ==============================================================================
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# --> Rosé Pine color overrides
set -ogq @thm_bg "#191724"          # base
set -ogq @thm_fg "#e0def4"          # text

# Colors
set -ogq @thm_rosewater "#ebbcba"   # rose
set -ogq @thm_flamingo "#ebbcba"    # rose
set -ogq @thm_pink "#eb6f92"        # love
set -ogq @thm_mauve "#c4a7e7"       # iris
set -ogq @thm_red "#eb6f92"         # love
set -ogq @thm_maroon "#eb6f92"      # love
set -ogq @thm_peach "#f6c177"       # gold
set -ogq @thm_yellow "#f6c177"      # gold
set -ogq @thm_green "#31748f"       # pine
set -ogq @thm_teal "#9ccfd8"        # foam
set -ogq @thm_sky "#9ccfd8"         # foam
set -ogq @thm_sapphire "#9ccfd8"    # foam
set -ogq @thm_blue "#9ccfd8"        # foam
set -ogq @thm_lavender "#c4a7e7"    # iris

# Surfaces and overlays
set -ogq @thm_subtext_1 "#908caa"   # subtle
set -ogq @thm_subtext_0 "#908caa"   # subtle
set -ogq @thm_overlay_2 "#6e6a86"   # muted
set -ogq @thm_overlay_1 "#6e6a86"   # muted
set -ogq @thm_overlay_0 "#6e6a86"   # overlay

set -ogq @thm_surface_2 "#524f67"   # highlightHigh
set -ogq @thm_surface_1 "#403d52"   # highlightMed
set -ogq @thm_surface_0 "#1f1d2e"   # surface
set -ogq @thm_mantle "#191724"      # base
set -ogq @thm_crust "#191724"       # base

# ==============================================================================
# ONLINE STATUS
# ==============================================================================
set -g @online_icon "ok"
set -g @offline_icon "nok"

# ==============================================================================
# STATUS BAR — General
# ==============================================================================
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# ==============================================================================
# STATUS LEFT
# ==============================================================================
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# ==============================================================================
# STATUS RIGHT
# ==============================================================================
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# ==============================================================================
# PANE BORDERS
# ==============================================================================
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# ==============================================================================
# WINDOWS
# ==============================================================================
set -wg automatic-rename on
set -g automatic-rename-format "Window"
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

# ==============================================================================
# TPM INIT — must be last
# ==============================================================================
run '~/.config/tmux/plugins/tpm/tpm'

# Key    Function
# Enter  Choose selected item
# Up     Select previous item
# Down   Select next item
# x      Kill selected item
# X      Kill tagged items
# <      Scroll list of previews left
# >      Scroll list of previews right
# C-s    Search by name
# n      Repeat last search
# t      Toggle if item is tagged
# T      Tag no items
# C-t    Tag all items
# :      Run a command for each tagged item
# f      Enter a format to filter items
# O      Change sort order
# v      Toggle preview
# q      Exit mode
